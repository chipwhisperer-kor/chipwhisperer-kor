id: "007_demo_hw_masked"
title: "통합 데모 실물 전력 — masked-aes-c"
rationale: >
  CW308T-STM32F3에서 masked-aes-c를 실행하고 논리 레코드마다 원 파형 10개와 실제 마스크
  10개를 회수해 보존한다. 같은 조건의 비마스킹 양성 대조 006과 함께 해석한다.
scope:
  standard: "ISO/IEC 17825:2024"
  assessment_type: "pre-assessment"
  clauses_applied: ["7", "8"]
  security_function: "AES-128-ECB"
  csp_classes: ["cryptographic key"]
  channels: ["power"]
  target_level: 3
  not_claimed:
    - "ISO/IEC 19790 적합성 — 모듈 경계·CSP 정의가 환경 밖이다"
    - "독립 시험소 평가 — 벤더와 시험자가 동일하다"
    - "EM 및 cw_debugtrace 관측 — 준비된 채널이 아니다"
    - "명령어 주소 역추적과 soundness — sample_map이 없는 물리 파형에는 적용하지 않는다"
    - "고차 DPA 저항성 — 1차 부울 마스킹의 2차 분석은 범위 밖이다"
    - "KeyExpansion 보호 — 이 구현은 CipherMasked만 보호한다"
    - "SPA 육안 판정 — 사람의 검토가 필요하다"
    - "DPA 검출 없음에 따른 안전 판정 — Formula (1) 요구량보다 작다"
    - "션트 최대값 검증 — 공장 R3 값보다 큰 저항을 비교하지 않았다"
iut:
  name: "masked-aes-c"
  countermeasure: "1st-order Boolean masking (CipherMasked only; KeyExpansion unprotected)"
collector:
  kind: "cw_power"
  platform: "CW308_STM32F3"
  adc_mul: 4
  gain_db: 20.0
  bandwidth_hz: 150000000
  bandwidth_basis: "Husky 측정 경로 AD8330의 공식 명목 대역폭; 현재 실험대에서 교정한 실측값이 아니다"
  bandwidth_is_nominal: true
  shunt_ohm: 12.0
  shunt_selection_note: "CW308T-STM32F3 공식 회로의 공장 R3=12 ohm; 더 큰 저항과 동작 범위를 비교하지 않았다"
  shunt_max_verified: false
  window:
    from_symbol: "AES_init_ctx"
    to_symbol: "AES_ECB_encrypt"
    semantics: "MY_AES_ECB 트리거 HIGH; 비보호 KeyExpansion과 CipherMasked 전체"
subsets:
  - {name: ta_rk_fp,    role: timing,                    n: 32,  key_mode: random, pt_mode: fixed}
  - {name: ta_fk_rp,    role: timing,                    n: 32,  key_mode: fixed,  pt_mode: random}
  - {name: spa_same,    role: simple-analysis,           n: 4,   key_mode: fixed,  pt_mode: fixed,  spa_pair_kind: same-data}
  - {name: spa_diffkey, role: simple-analysis,           n: 4,   key_mode: random, pt_mode: fixed,  spa_pair_kind: different-data-fixed}
  - {name: spa_diffpt,  role: simple-analysis,           n: 4,   key_mode: fixed,  pt_mode: random, spa_pair_kind: different-data-random}
  - {name: tvla_fk,     role: leakage-detection-fixed,   n: 64,  key_mode: fixed,  pt_mode: fixed}
  - {name: tvla_rk,     role: leakage-detection-random,  n: 64,  key_mode: fixed,  pt_mode: random}
  - {name: attack,      role: attack,                    n: 128, key_mode: fixed,  pt_mode: random}
criteria:
  security_level: 3
  effect_size_d: 0.04
  alpha: 1.0e-5
  beta: 0.05
  multiplicity_correction: "bonferroni"
  t_threshold: 4.5
  max_acquisition_hours: 6
  sensitive_leakage_time:
    from: "0"
    to: "end"
    include_round1: true
    rationale: "물리 트리거 전체를 분석하되 비보호 KeyExpansion과 보호 대상 CipherMasked의 혼합임을 보고서에서 분리해 해석한다."
  preprocessing: {average_n: 10, alignment: "none"}
  vendor_info:
    algorithms: "AES-128 ECB (masked-aes-c)"
    design: "CW308_STM32F3, CipherMasked 1차 부울 마스킹, KeyExpansion 비보호, -Os Cortex-M4 펌웨어"
    susceptible_conditions: "같은 저장소를 연속 사용하는 share 전이와 물리 글리치·커플링은 실측 교차 확인 대상이다"
analyses: ["ta", "spa", "dpa", "cpa"]
seed: 1234
