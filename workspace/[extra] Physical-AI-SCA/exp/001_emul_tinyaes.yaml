schema_version: 2
id: "001_emul_tinyaes"
assessment_profile: "iso-17825-l3"
campaign_stage: "cw-lab-pilot"
algorithm: "aes-128-ecb"
title: "에뮬레이션 — 비마스킹 AES (검출기 양성 대조군)"
rationale: >
  이 실험의 목적은 tiny-AES-c 의 취약성을 밝히는 것이 아니다. 비마스킹 구현이므로
  누설이 있다는 것은 이미 알고 있다. 목적은 **검출기가 실제로 반응하는지 확인하는 것**이다.
  마스킹 구현에서 "아무것도 검출되지 않았다" 는 결과는, 같은 검출기가 비마스킹
  구현에서는 반응한다는 증거가 있어야만 의미를 갖는다. 그 증거를 만드는 실험이다.

scope:
  standard: "ISO/IEC 17825:2024"
  assessment_type: "pre-assessment"
  clauses_applied: ["7", "8"]
  csp_classes: ["cryptographic key"]
  channels: ["emulated-power"]
  not_claimed:
    - "ISO/IEC 19790 적합성 — 모듈 경계·CSP 정의가 이 환경 밖이다"
    - "독립 시험소 평가 — 벤더와 시험자가 동일하다(자기시험)"
    - "물리 측정 — 이 채널의 값은 측정치가 아니라 누설 모델의 출력이다"
    - "EM (SEMA/DEMA) — 근접 자기장 프로브를 보유하지 않는다"
    - "cycle-accurate 타이밍 — Unicorn 에 사이클 모델이 없어 명령어 수로만 잰다"
    - "Annex H 민감 경계 확정 — 아래 경계는 제안이며 확정은 사람·승인 기관의 몫이다"

iut:
  name: "tiny-AES-c"
  countermeasure: "none"

collector:
  kind: "emulation"
  components: ["hw_reg", "hd_reg", "hw_mem", "hd_mem"]
  window:
    from_symbol: "AES_init_ctx"
    to_symbol: "AES_ECB_encrypt"
    semantics: >
      AES_init_ctx(KeyExpansion) 진입부터 AES_ECB_encrypt 복귀까지.
      실측 펌웨어의 MY_AES_ECB 트리거와 같은 구간이라 두 채널을 나란히 놓을 수 있다.

subsets:
  - {name: ta_rk_fp,   role: timing, key_mode: random, pt_mode: fixed}
  - {name: ta_fk_rp,   role: timing, key_mode: fixed,  pt_mode: random}
  - {name: spa_same,   role: simple-analysis,    key_mode: fixed,  pt_mode: fixed,  spa_pair_kind: same-data}
  - {name: spa_diffkey, role: simple-analysis,    key_mode: random, pt_mode: fixed,  spa_pair_kind: different-data-fixed}
  - {name: spa_diffpt,  role: simple-analysis,    key_mode: fixed,  pt_mode: random, spa_pair_kind: different-data-random}
  - {name: tvla_fk,    role: leakage-detection-fixed, key_mode: fixed,  pt_mode: fixed}
  - {name: tvla_rk,    role: leakage-detection-random, key_mode: fixed,  pt_mode: random}
  - {name: profiling,  role: profiling, key_mode: random, pt_mode: random}
  - {name: attack,     role: attack, key_mode: fixed,  pt_mode: random}

criteria_context:
  sensitive_leakage_time:
    from: "0"
    to: "end"
    include_round1: true
    rationale: >
      Annex H.2(a) 는 블록암호의 바깥 라운드(예: AES 첫/마지막 1/3 라운드)를 비민감 누설
      예시로 든다. 그러나 이 시험은 1라운드 SBox 출력을 주 표적으로 삼으므로 1라운드를
      민감 경계 **안**에 둔다. 근거: (1) Annex H 는 informative 이며 "예시" 이고
      approval authority 가 대체할 수 있다. (2) 이 IUT 는 암호모듈이 아니라 라이브러리라
      키 로딩·언로딩 경계가 존재하지 않는다. (3) 1라운드 SBox 는 분할정복 키 복구의
      표준 표적이므로 실무 위협 모형에서 민감하다. 이 판단은 합/부를 직접 바꾸므로
      보고서에 그대로 실린다.
  vendor_info:
    algorithms: "AES-128 ECB (tiny-AES-c, kokke/tiny-AES-c 벤더 원본 무수정)"
    design: >
      8비트 S-box 표 참조, state 를 16바이트 메모리 배열에 두고 in-place 갱신.
      키 스케줄은 암호화 직전에 매번 수행하며 관측 구간 안에 포함된다.
      대책 없음 — 마스킹·셔플링·랜덤 지연 어느 것도 적용하지 않았다.
    susceptible_conditions: >
      대책이 없으므로 1차 DPA 에 그대로 노출된다. 이 실험은 그 사실을 확인해
      검출기의 유효성을 입증하는 데 쓴다.

analyses: ["ta", "spa", "tvla", "dpa", "soundness", "cpa"]
analysis_inputs:
  tvla: {fixed: "tvla_fk", random: "tvla_rk"}
  dpa: {subset: "attack", target: "round1-sbox-byte0-bit0"}
  cpa: {subset: "attack"}
seed: 1234
