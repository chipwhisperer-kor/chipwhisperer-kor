id: "002_emul_masked"
title: "에뮬레이션 — 1차 마스킹 AES 구현의 soundness 검증"
rationale: >
  이 프로젝트의 본 실험이다. 논문이 증명하는 것은 "올바르게 마스킹된 구현에서는 모든
  연산의 HW·HD 가 비마스킹 알고리즘의 민감값과 통계적으로 독립" 이라는 명제다.
  코딩 과정의 휴먼 에러는 그 고리를 되살린다 — 같은 레지스터에 두 share 를 연달아 쓰면
  HD = HW(share1 ^ share2) = HW(민감값) 이 되어, 수식은 그대로인데 구현만 새게 된다.
  이 실험은 그 종속성이 남아 있는 지점을 **명령어 단위로 지목**한다.
  판정은 1차 누설 검출로 한다(ISO/IEC 17825 §7.2 — 키 복구까지 가지 않아도 누설 관측만으로
  fail). 고차 DPA 는 시험하지 않는다(Fig.1 NOTE 3 — 필수 시험이 아니며, 1차 부울 마스킹이
  2차에서 뚫리는 것은 이론적으로 정상이라 결함으로 보고할 수도 없다).

scope:
  standard: "ISO/IEC 17825:2024"
  assessment_type: "pre-assessment"
  clauses_applied: ["7", "8"]
  security_function: "AES-128-ECB"
  csp_classes: ["cryptographic key"]
  channels: ["emulated-power"]
  target_level: 3
  not_claimed:
    - "ISO/IEC 19790 적합성 — 모듈 경계·CSP 정의가 이 환경 밖이다"
    - "독립 시험소 평가 — 벤더와 시험자가 동일하다(자기시험)"
    - "물리 측정 — 이 채널의 값은 측정치가 아니라 누설 모델의 출력이다. 여기서 깨끗해도 실물에서 샐 수 있다"
    - "고차(2차 이상) DPA 저항성 — 시험 범위 밖이다"
    - "EM (SEMA/DEMA) — 근접 자기장 프로브를 보유하지 않는다"
    - "cycle-accurate 타이밍 — Unicorn 에 사이클 모델이 없어 명령어 수로만 잰다"
    - "KeyExpansion 의 보호 — 이 구현은 CipherMasked 만 보호하며 키 스케줄은 벤더 원본 비마스킹이다"
    - "Annex H 민감 경계 확정 — 아래 경계는 제안이며 확정은 사람·승인 기관의 몫이다"

iut:
  name: "masked-aes-c"
  countermeasure: >
    1st-order Boolean masking (masked-aes-c, CipherMasked 구간만; KeyExpansion 은 비보호)

collector:
  kind: "emulation"
  components: ["hw_reg", "hd_reg", "hw_mem", "hd_mem"]
  window:
    from_symbol: "AES_init_ctx"
    to_symbol: "AES_ECB_encrypt"
    semantics: >
      AES_init_ctx(KeyExpansion) 진입부터 AES_ECB_encrypt 복귀까지.
      실측 펌웨어의 MY_AES_ECB 트리거와 같은 구간이라 두 채널을 나란히 놓을 수 있다.
      **키 스케줄이 이 구간 안에 있고 그것은 비마스킹이다** — 앞부분에서 누설이 검출되는
      것은 정상이며, 관심사는 CipherMasked 구간이다.

subsets:
  - {name: ta_rk_fp,   role: timing,                    n: 1000, key_mode: random, pt_mode: fixed}
  - {name: ta_fk_rp,   role: timing,                    n: 1000, key_mode: fixed,  pt_mode: random}
  - {name: spa_same,   role: simple-analysis,           n: 6,    key_mode: fixed,  pt_mode: fixed,  spa_pair_kind: same-data}
  - {name: spa_diffkey, role: simple-analysis,          n: 6,    key_mode: random, pt_mode: fixed,  spa_pair_kind: different-data-fixed}
  - {name: spa_diffpt,  role: simple-analysis,          n: 6,    key_mode: fixed,  pt_mode: random, spa_pair_kind: different-data-random}
  - {name: tvla_fk,    role: leakage-detection-fixed,   n: 2000, key_mode: fixed,  pt_mode: fixed}
  - {name: tvla_rk,    role: leakage-detection-random,  n: 2000, key_mode: fixed,  pt_mode: random}
  - {name: profiling,  role: profiling,                 n: 4000, key_mode: random, pt_mode: random}
  - {name: attack,     role: attack,                    n: 2000, key_mode: fixed,  pt_mode: random}

criteria:
  security_level: 3
  effect_size_d: 0.04
  alpha: 1.0e-5
  beta: 0.05
  multiplicity_correction: "bonferroni"
  t_threshold: 4.5
  max_acquisition_hours: 6
  sensitive_leakage_time:
    from: "0"
    to: "end"
    include_round1: true
    rationale: >
      001 과 같은 판단이다. Annex H.2(a) 는 바깥 라운드를 비민감 예시로 들지만, 이 시험은
      1라운드 SBox 출력을 주 표적으로 삼으므로 민감 경계 안에 둔다(H 는 informative 이며
      approval authority 가 대체 가능, 이 IUT 는 모듈이 아니라 키 로딩 경계가 없음,
      1라운드는 분할정복 키 복구의 표준 표적). 다만 이 IUT 는 KeyExpansion 이 비보호이므로
      **구간 앞부분의 검출은 결함이 아니라 문서화된 보호 범위 밖**이다. 보고서는 두 구간을
      나누어 보고한다.
  preprocessing:
    average_n: 1
    alignment: "none"
  vendor_info:
    algorithms: "AES-128 ECB (masked-aes-c, CENSUS/masked-aes-c MELITY PoC 기반)"
    design: >
      1차 부울 마스킹. 난수 6바이트(M1..M4, M, M')에서 MixColumns 유도 4바이트를 계산해
      mask[10] 을 이룬다. 마스킹된 S-box 표를 매 암호화마다 다시 만들고(calcSboxMasked,
      256회 루프) CipherMasked 안에서만 보호한다. **KeyExpansion 은 벤더 원본 비마스킹**이며
      관측 구간 안에서 수행된다. 이 저장소가 가한 수정 3건은 workspace/iut/README.md 참고
      (마스크 export 훅, per-encrypt srand 제거, rand() % 0xFF → & 0xFF 편향 수정).
      난수 시드는 호스트가 vir_IN[32:36] 으로 주입한다.
    susceptible_conditions: >
      마스킹의 안전성은 난수의 비밀성과 균일성에 걸려 있다. 시드가 고정되거나 RNG 가
      편향되면 1차 누설이 그대로 남는다. 또한 KeyExpansion 구간은 설계상 보호되지 않으므로
      키 스케줄 중간값을 겨냥한 공격에는 대책이 없다.

analyses: ["ta", "spa", "dpa", "soundness", "cpa"]
seed: 1234
