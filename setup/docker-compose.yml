services:
  chipwhisperer:
    build:
      context: ./cw-build
      dockerfile: Dockerfile
    image: chipwhisperer-kor:20261007   # `docker compose up -d --build` 가 Dockerfile 로 만드는 태그다(pypicosdk·libpsospa 포함).
                                        # 2026-09-29 컨테이너 상태를 보존한 이전 이미지 `chipwhisperer-kor:preserved-20260929` 는 덮어쓰지 않고 남겨 둔다
    container_name: chipwhisperer-kor
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:8080:8080"            # code-server는 인증이 없으므로(--auth none) 로컬 전용이다. 원격에서는 ssh -L로 접속한다
    volumes:
      - ../workspace:/workspace           # 작업 파일을 두는 디렉터리다
      - /dev/bus/usb:/dev/bus/usb      # USB 장치를 직접 매핑한다
