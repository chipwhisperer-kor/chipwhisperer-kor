# Python 3.12 이미지에 실제로 설치된 조합 (2026-10-07 빌드, 아래 검증 통과).
#
# requirements.txt 는 "무엇을 넣을지", 이 파일은 "무엇이 들어갔는지"를 적는다.
# 빌드는 이 파일을 쓰지 않는다. requirements.txt 로 해석한 결과의 기록이다.
#
# 남기는 이유: 고정하는 패키지가 setuptools·pypicosdk 둘뿐이라 나머지는 매 빌드마다 그날의
# 최신을 받는다. 의도한 정책이지만, 그래서 "언제 무엇이 돌아갔는지"의 기록이 필요하다.
# 3.9 이미지가 깨진 방식이 정확히 이 드리프트였다 (setuptools 79 → 82).
# 문제가 생기면 이 파일로 설치해 재현하고, 그날의 pip freeze 와 diff 해서 무엇이
# 움직였는지 본다. 비교 대상이던 3.9 스냅샷(requirements.py39.lock)은 3.12 전환이
# 끝나 되돌아갈 일이 없어졌으므로 2026-08-19 에 삭제했다.
#
# 2026-10-07 빌드의 검증 내역:
#   - import chipwhisperer·h5py·bokeh·scalib·pypicosdk 정상, pip check 충돌 없음
#   - libpsospa 1.1.7 이 /opt/picoscope/lib 에 풀려 ldconfig 에 잡히고, pypicosdk 1.7.5 가
#     PicoScope 3418E MSO(sn 13867/0089)를 열거했다 (`4. FPGA CW310/3.0` 노트북의 런타임)
#   - `4. FPGA CW310/3.0` 노트북 1~5.1단계를 실장비(CW1200·CW310·3418E)에서 실행해 통과했다.
#     5.2 는 10:1 프로브의 AUX 트리거가 임계값(1.65 V)을 넘지 못해 설계대로 TimeoutError 로 멈췄다
#   - 2026-08-06 빌드에서 확인했던 TVLA·PRE-SCA 비트 단위 일치는 이번 빌드에서 다시 돌리지
#     않았다. 그 결과를 이 조합의 증거로 쓰지 않는다
#
