# Python 3.12 이미지에 실제로 설치된 조합 (2026-08-06 빌드, 아래 검증 통과).
#
# requirements.txt 는 "무엇을 넣을지", 이 파일은 "무엇이 들어갔는지"를 적는다.
# 빌드는 이 파일을 쓰지 않는다 — requirements.txt 로 해석한 결과의 기록이다.
#
# 남기는 이유: 고정하는 패키지가 setuptools 하나뿐이라 나머지는 매 빌드마다 그날의
# 최신을 받는다. 의도한 정책이지만, 그래서 "언제 무엇이 돌아갔는지"의 기록이 필요하다.
# 3.9 이미지가 깨진 방식이 정확히 이 드리프트였다 (setuptools 79 → 82).
# 문제가 생기면 이 파일로 설치해 재현하고, requirements.py39.lock 과 diff 해서
# 무엇이 움직였는지 본다.
#
# 검증 내역 (하드웨어 불필요):
#   - import chipwhisperer 정상 (TraceWhisperer 의 pkg_resources 리소스 해석 포함)
#   - TVLA 계산 계층이 3.9 레퍼런스와 비트 단위 일치 — tt SHA-256 23ff0d1a... 동일
#     (scalib 0.6.0 → 0.6.4 로 올린 뒤에도 동일)
#   - PRE-SCA 에뮬레이션이 3.9 실행과 바이트 단위 일치 (LogReg/LogVirIN/LogVirOUT)
#   - SCALib_TVLA_tutorial.ipynb 계산 셀 전부 일치 (버전 배너·pip 경고문구 제외)
#   - pip check 충돌 없음
#
